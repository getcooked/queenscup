org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Where the app finds the Laravel API. Must end with a trailing slash.
#
# Debug default is 10.0.2.2, the Android emulator's alias for the host machine.
# Set the release URL to your live site before building an APK to hand out,
# otherwise the release build inherits the debug value and will not reach your
# server from a real phone.
# ---------------------------------------------------------------------------
# QC_API_BASE_URL_DEBUG=http://192.168.1.10:8000/api/v1/
# QC_API_BASE_URL_RELEASE=https://yourdomain.com/api/v1/
QC_API_BASE_URL_RELEASE=https://queenscup-pos.com/api/v1/

# Release signing. Passwords live in keystore.properties, which is not
# committed; see android/README.md.
QC_KEYSTORE_FILE=queenscup-release.jks
QC_KEY_ALIAS=queenscup
